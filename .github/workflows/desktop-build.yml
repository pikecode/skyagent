name: Desktop verification and development builds
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native build target
        type: choice
        options: [windows, macos, both]
        default: windows
  push:
    paths: ['skyagent_manager/**', 'tests/**', 'packaging/**', 'pyproject.toml', '.github/workflows/desktop-build.yml']
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/heads/build/windows-') && '["windows-latest"]' || github.event_name == 'workflow_dispatch' && inputs.target == 'windows' && '["windows-latest"]' || github.event_name == 'workflow_dispatch' && inputs.target == 'macos' && '["macos-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m ruff check skyagent_manager tests packaging
      - run: python packaging/ci_tests.py --timeout 180
      - run: python -m skyagent_manager.main --self-check
      - run: python -m skyagent_manager.contract_check
      - run: python packaging/build.py
      - name: Verify frozen macOS app
        if: runner.os == 'macOS'
        run: |
          dist/darwin/SkyAgentManager.app/Contents/MacOS/SkyAgentManager --self-check --self-check-report build/frozen-check.json
          dist/darwin/SkyAgentManager.app/Contents/MacOS/SkyAgentManager --sync-self-check --self-check-report build/frozen-sync-check.json
      - name: Verify frozen Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/win32/SkyAgentManager/SkyAgentManager.exe -ArgumentList '--self-check', '--self-check-report', 'build/frozen-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen startup failed' }
          if (!(Get-Content build/frozen-check.json | ConvertFrom-Json).ok) { throw 'Self-check failed' }
          $process = Start-Process -FilePath dist/win32/SkyAgentManager/SkyAgentManager.exe -ArgumentList '--sync-self-check', '--self-check-report', 'build/frozen-sync-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen sync check failed' }
          if (!(Get-Content build/frozen-sync-check.json | ConvertFrom-Json).ok) { throw 'Sync self-check failed' }
      - name: Package verified Windows x64 ZIP
        if: runner.os == 'Windows'
        run: python packaging/windows_release.py --existing-build dist/win32/SkyAgentManager --output dist/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: SkyAgentManager-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/
            build/frozen-check.json
            build/frozen-sync-check.json
