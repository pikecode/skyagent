name: Stop superseded Windows build
on:
  push:
    paths: ['.github/workflows/windows-recover.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop-owned-run:
    if: github.ref == 'refs/heads/build/windows-0.2.28-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop only the previously submitted stuck run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          url = 'https://api.github.com/repos/pikecode/skyagent/actions/runs/37727984117'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urlopen(Request(url, headers=headers), timeout=20) as response:
              previous = json.load(response)
          if previous['head_sha'] != 'd012e5314dcfff84bfc72d67d89da9228eff8f1d' or previous['head_branch'] != 'build/windows-0.2.28-20261008':
              raise RuntimeError('Unexpected run identity; cancellation refused')
          if previous['status'] != 'completed':
              try:
                  with urlopen(Request(url + '/force-cancel', headers=headers, method='POST'), timeout=20):
                      pass
              except HTTPError as error:
                  if error.code != 409:
                      raise
          print('Superseded build stopped or already completed; other runs unchanged.')
          PY
